<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="sources_page_title">Wilde Westen &amp; Country Bronnen Ledger</title>
    <link rel="stylesheet" href="../resources/style/landing.css">
    <link rel="stylesheet" href="../resources/style/navbar.css">
    <link rel="stylesheet" href="../resources/style/bronnen.css">
    <link rel="stylesheet" href="../resources/style/custom-scrollbar.css">
    <link rel="stylesheet" href="../resources/style/language-changer.css">
</head>

<body class="page-body">

    <!-- ==================== MARK: NAVIGATIE ==================== -->
    <nav class="western-nav nav-margin">
        <ul>
            <li><a href="../html/landing.html" data-i18n="nav_home">Home</a></li>
            <li><a href="https://github.com/OluwaseyiOluwatobiBarbaraDavies/GarnetsOcean" target="_blank" rel="noopener" data-i18n="nav_readme">Read Me</a></li>
            <li><a href="../html/story.html" data-i18n="nav_story">Story</a></li>
            <li><a href="../html/bronnen.html" class="active" aria-current="page" data-i18n="nav_sources">Bronnen</a></li>
            <li class="nav-language"><button id="langToggleBtn" type="button">NL / ENG</button></li>
        </ul>
    </nav>





    <!-- ==================== MARK: PAGINATITEL EN KNOPPEN ==================== -->
    <header class="page-container header-margin text-center">
        <div class="wooden-plank header-card">
            <h1 data-i18n="sources_heading">BRONVERMELDINGEN</h1>
            <div class="tab-container">
                <button id="tabVisualBtn" onclick="switchView('visual')" class="tab-btn tab-btn-active" data-i18n="sources_tab_visual">🖼️ Afbeeldingsbronnen</button>
                <button id="tabResearchBtn" onclick="switchView('research')" class="tab-btn tab-btn-inactive" data-i18n="sources_tab_research">📚 Onderzoek &amp; Literatuur</button>
            </div>
        </div>
    </header>





    <!-- ==================== MARK: BRONNEN ==================== -->
    <main class="page-container">
        <!-- MARK: AFBEELDINGSBRONNEN -->
        <section id="visualView" class="view-section">
            <h2 data-i18n="sources_tab_visual">🖼️ Afbeeldingsbronnen</h2>
            <div class="parchment-bg filter-bar">
                <input type="text" id="searchInput" oninput="filterSources()" placeholder="Zoek bestand, artiest, uitgever..." aria-label="Zoek bestand, artiest, uitgever..." data-i18n-placeholder="sources_search" data-i18n-aria-label="sources_search" class="search-input">
                <!-- De categoriewaaarden blijven hetzelfde bij het wisselen van taal -->
                <div id="filterContainer" class="filter-group">
                    <button onclick="setCategory('Alle')" data-category="Alle" class="filter-btn filter-btn-active"><span data-i18n="sources_filter_all">Alle</span> (9)</button>
                    <button onclick="setCategory('Artiesten')" data-category="Artiesten" class="filter-btn filter-btn-inactive"><span data-i18n="sources_filter_artists">Artiesten</span> (5)</button>
                    <button onclick="setCategory('Evenementen &amp; Posters')" data-category="Evenementen &amp; Posters" class="filter-btn filter-btn-inactive"><span data-i18n="sources_filter_events">Evenementen</span> (3)</button>
                    <button onclick="setCategory('Landschap')" data-category="Landschap" class="filter-btn filter-btn-inactive"><span data-i18n="sources_filter_landscape">Landschap</span> (1)</button>
                </div>
            </div>
            <!-- Hier zet bronnen.js de afbeeldingen en hun bronnen neer. -->
            <div id="sourcesGrid" class="sources-grid"></div>
        </section>

        <!-- MARK: ONDERZOEK EN LITERATUUR -->
        <section id="researchView" class="view-section hidden">
            <div class="parchment-bg research-card">
                <div class="research-header">
                    <h2 data-i18n="sources_research_heading">📚 Literatuur &amp; Historische Bronnen</h2>
                    <p class="research-subtitle" data-i18n="sources_research_subtitle">Overzicht van artikelen, musea en archieven die zijn geraadpleegd voor het onderzoek.</p>
                </div>
                <div id="researchList" class="research-list"></div>
            </div>
        </section>
    </main>




    
    <!-- ==================== MARK: SCRIPTS ==================== -->
    <script src="../js/bronnen.js" defer></script>
    <script src="../js/custom-scrollbar.js" defer></script>
    <script src="../js/navbar.js" defer></script>
    <script src="../js/language-changer.js" defer></script>
</body>
</html>
