<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter the Saloon</title>
  <link rel="stylesheet" href="assets/resources/style/style.css">
  <link rel="stylesheet" href="assets/resources/style/landing.css">
</head>
<body class="landing-body">

  <div class="hanging-lasso" title="Coiled Lasso">
    <div class="lasso-loop"></div>
    <div class="lasso-loop inner"></div>
    <div class="lasso-knot"></div>
  </div>

  <div class="saloon-stage">
    
    <div class="saloon-sign">
      <h1>SALOON</h1>
    </div>

    <div class="saloon-frame">
      <div class="frame-lantern lantern-left">
        <div class="lantern-bracket"></div>
        <div class="saloon-lantern">
          <div class="lantern-glow"></div>
          <div class="lantern-top"></div>
          <div class="lantern-glass">
            <!-- Pure CSS Flame -->
            <div class="css-flame">
              <div class="flame-outer"></div>
              <div class="flame-inner"></div>
              <div class="flame-core"></div>
            </div>
          </div>
          <div class="lantern-base"></div>
        </div>
      </div>

      <div class="frame-lantern lantern-right">
        <div class="lantern-bracket"></div>
        <div class="saloon-lantern">
          <div class="lantern-glow"></div>
          <div class="lantern-top"></div>
          <div class="lantern-glass">
            <!-- Pure CSS Flame -->
            <div class="css-flame">
              <div class="flame-outer"></div>
              <div class="flame-inner"></div>
              <div class="flame-core"></div>
            </div>
          </div>
          <div class="lantern-base"></div>
        </div>
      </div>

      <div class="interior-glow"></div>

      <div id="saloonDoors" class="saloon-doors">
        <div class="door door-left">
          <div class="door-inner-border">
            <div class="slat-pattern"></div>
          </div>
        </div>
        <div class="door door-right">
          <div class="door-inner-border">
            <div class="slat-pattern"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="barrel-container" title="Wooden Barrel with Hat">
    <div class="cowboy-hat">
      <div class="hat-crown"></div>
      <div class="hat-brim"></div>
      <div class="hat-band"></div>
    </div>
    <div class="wooden-barrel">
      <div class="barrel-hoop hoop-top"></div>
      <div class="barrel-hoop hoop-middle"></div>
      <div class="barrel-hoop hoop-bottom"></div>
    </div>
  </div>

  <div id="doorTooltip" class="door-tooltip">Come in</div>

  <script src="assets/js/script.js" defer></script>
</body>
</html>
