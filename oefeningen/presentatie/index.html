# Mijn onderwerp

### Waarom country?

Ik ben geboren en opgegeroeid in **Houston, Texas**, waar countrymuziek een groot onderdeel is van de muziek- en cultuurwereld. Je komt het genre op veel plekken tegen, bijvoorbeeld bij **rodeos, Country Day en andere lokale evenementen**.

Zelf luister ik ook graag naar countrymuziek. Vooral **Don Williams, Kameron Marlowe en Warren Zeiders** zijn artiesten die ik veel luister.

Wat ik interessant vind aan country is dat het genre door de jaren heen sterk is veranderd. Van de traditionele country van vroeger tot de moderne varianten van tegenwoordig.

Toch blijven de **roots, verhalen en herkenbare stijl** van countrymuziek behouden. Dat maakt het voor mij interessant om te onderzoeken hoe het genre zich heeft ontwikkeld en waarom het nog steeds zo'n belangrijk onderdeel is van de Amerikaanse muziekcultuur.

<img src="../../assets/images/collage1.png">

---

# Oorsprong

Country ontstond in de **Verenigde Staten**, vooral in het zuiden en de Appalachen.

De muziek kwam voort uit verschillende tradities van immigranten en lokale Amerikaanse muziek.

### Belangrijk:
**Folk + Blues + Gospel → Country**

---

# Muzikale invloeden

### Folk
Traditionele verhalen en akoestische instrumenten.

### Blues
Invloed op zang en gitaar.

### Gospel
Zang en harmonieën.

### Bluegrass
Banjo, fiddle en mandoline.

**Country is dus een mix van verschillende muziekstijlen.**

---

# Ontwikkeling

### 1920s
Eerste commerciële opnames.

### 1930s–40s
Radio maakt country populair.

### 1950s
Invloed van rock-'n-roll.

### 1960s–90s
Nieuwe stijlen zoals Outlaw Country en countryrock.

### 2000s–nu
Steeds meer popinvloeden.

---

# Bluegrass 🪕

Bluegrass is een belangrijke stijl binnen de countrymuziek.

### Kenmerkend:

🪕 Banjo  
🎻 Fiddle  
🎸 Akoestische gitaar  
🎶 Meerstemmige zang

Bluegrass staat bekend om **snelle instrumentale muziek** en sterke harmonieën.

---

# Bekende artiesten

### Dolly Parton
Traditionele country & songwriting

### Johnny Cash
Country, folk & rock

### Willie Nelson
Outlaw Country

### Post Malone
Hiphop → Country

Deze artiesten laten zien hoe breed countrymuziek is.

---

# Country vandaag

Country is tegenwoordig niet meer alleen traditionele muziek.

Het genre wordt gecombineerd met:

**Pop • Rock • Hiphop • R&B**

Hierdoor bereikt country een **nieuw en groter publiek**.

### Van Amerikaanse roots → wereldwijd populair

# Afsluiting

## Countrymuziek

Country is ontstaan uit verschillende muziekstijlen en is voortdurend blijven veranderen.

**Van folk en blues → naar moderne pop-country.**

De muziek verandert, maar de **roots blijven herkenbaar.**
