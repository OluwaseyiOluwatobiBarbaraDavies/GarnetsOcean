# Mijn startpunt

Countrymuziek is voor mij meer dan alleen een muziekgenre.

Ik ben geboren en opgegroeid in **Houston, Texas**, waar countrymuziek onderdeel is van de cultuur.

Je komt het bijvoorbeeld tegen bij:

- Rodeos
- Country Days
- Lokale evenementen
- Concerten en festivals

<img src="../../assets/images/collage2.png">

---

# Waarom country?

Ik luister zelf graag naar countrymuziek.

Vooral:

- **Dolly Parton**
- **Don Williams**
- **Ella Langley**  
- **Kameron Marlowe**  
- **Warren Zeiders**

vind ik interessant.

Country is daarnaast door de jaren heen sterk veranderd.

Van traditionele country tot moderne muziek met invloeden van **pop, rock en hiphop**.

Dat maakt het voor mij een interessant onderwerp om steeds verder te ontdekken.

<img src="../../assets/images/collage3.png">

# Country muziek als digital garden

Countrymuziek is een goed onderwerp voor een digital garden omdat het **veel verschillende kanten en verbindingen** heeft.

Vanuit één nummer of artiest kun je steeds nieuwe onderwerpen ontdekken:

- **Artiesten** → muziek, albums en songwriting
- **Muziekstijlen** → traditional country, bluegrass, country rock en modern country
- **Cultuur** → Texas, rodeo, cowboys en honky-tonk
- **Geschiedenis** → de oorsprong en ontwikkeling van country
- **Invloeden** → folk, blues, gospel, rock, pop en hiphop

Eén onderwerp kan dus steeds nieuwe takken creëren. Dit maakt countrymuziek geschikt voor een digital garden die **blijft groeien en veranderen**.

# Mijn garden is niet lineair

Een belangrijk onderdeel van mijn digital garden is dat ik niet één vaste route hoef te volgen.

Ik kan ergens beginnen en vervolgens een onverwachte richting opgaan.

<div class="taken-grid">
  <div>
    <ul>
      <li>Een nummer ↓</li>
      <li>Een artiest ↓</li>
      <li>muziekstijl ↓</li>
      <li>Een historische gebeurtenis ↓</li>
      <li>Een nieuwe artiest ↓</li>
      <li>Een heel nieuw onderwerp</li>
    </ul>
  </div>
</div>

Hierdoor ontstaan er steeds nieuwe verbindingen tussen mijn interesses.

# Reflectie

Het interessante aan dit proces is dat ik vooraf niet precies weet waar mijn digital garden zal eindigen.

Ik begin met iets waar ik zelf al interesse in heb: **countrymuziek**.

Door onderzoek te doen ontstaan nieuwe vragen, ideeën en verbanden.

Mijn garden groeit dus mee met mijn nieuwsgierigheid.
